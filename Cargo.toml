[package]
name = "bot-camp"
version = "0.1.0"
edition = "2024"
description = "Self-hosted test server for crawlers/scrapers — HTTP codes, headers, robots.txt, redirects, rate limiting & anti-bot"
license = "MIT"
authors = ["mhardy"]

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Middleware (tracing, compression, CORS)
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }

# Error handling
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Integration testing
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
