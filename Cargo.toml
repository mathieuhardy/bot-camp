[package]
name = "bot-camp"
version = "0.1.0"
edition = "2024"
description = "Self-hosted test server for crawlers/scrapers — HTTP codes, headers, robots.txt, redirects, rate limiting & anti-bot"
license = "MIT"
authors = ["mhardy"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
dashmap = "6"
minijinja = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
